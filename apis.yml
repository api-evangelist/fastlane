name: FastLane
description: >-
  FastLane Labs is a blockchain infrastructure provider building maximal
  extractable value (MEV) and liquid staking products on the Monad blockchain.
  Its core products are shMON, a liquid staking token that pairs staking rewards
  with revenue from FastLane's on-chain MEV auction and holds the majority of
  Monad's liquid-staking TVL; Smart Vault, a USDC-denominated yield product; and
  hMON, a yield-donation token. FastLane operates a public, on-chain MEV auction
  that a majority of Monad validators route blocks through, exposing developer
  surfaces for searchers (the FastLane Sidecar and auction-handler contracts),
  validators (a Leader API and validator onboarding), and stakers. It also
  maintains Atlas, an open-source execution-abstraction framework, with a Go SDK
  and JSON-RPC tooling published on GitHub. Developer integration is via JSON-RPC
  APIs and Solidity smart contracts rather than a REST/OpenAPI catalog.
